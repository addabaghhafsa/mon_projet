<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Tableau de bord</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container mt-5">

        <h1>Tableau de bord administrateur</h1>

        <div class="row mt-4">

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Biens</h5>
                    <p class="fs-2">{{ total_biens }}</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Créneaux</h5>
                    <p class="fs-2">{{ total_creneaux }}</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h5>Réservations</h5>
                    <p class="fs-2">{{ total_reservations }}</p>
                </div>
            </div>

        </div>

        <a href="/admin/" class="btn btn-secondary mt-4">
            Aller à l'administration
        </a>

    </div>

</body>

</html>
