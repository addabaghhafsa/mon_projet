<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Créneaux disponibles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1>Créneaux de visite disponibles</h1>
    <ul class="list-group">
        {% for creneau in creneaux %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            {{ creneau.bien.titre }} — {{ creneau.date }} à {{ creneau.heure }}
            <a href="/reservations/reserver/{{ creneau.id }}/" class="btn btn-primary btn-sm">Réserver</a>
        </li>
        {% endfor %}
    </ul>
</div>
</body>
</html>
