{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription — ImmoResa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f6f2; font-family: Georgia, serif; }
        .navbar { padding: 20px 0; background: white !important; border-bottom: 1px solid #eee; }
        .navbar-brand { letter-spacing: 3px; font-weight: bold; color: #2c2c2c !important; }
        .btn-outline-dark { border-color: #2c2c2c; color: #2c2c2c; }
        .btn-primary { background-color: #c9a876; border: none; border-radius: 0; }
        .btn-primary:hover { background-color: #b8925f; }
        .card-form { max-width: 450px; margin: 60px auto; box-shadow: 0 2px 20px rgba(0,0,0,0.08); border: none; border-radius: 0; }
        h1 { font-weight: 400; }
        label { font-size: 0.85rem; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .form-control { border-radius: 0; border: 1px solid #ddd; padding: 10px 12px; }
        .form-control:focus { border-color: #c9a876; box-shadow: none; }
        .error-text { color: #b0413e; font-size: 0.8rem; margin-top: 3px; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand" href="/">IMMORESA</a>
    <div>
      <a href="/comptes/connexion/" class="btn btn-outline-dark btn-sm">Connexion</a>
    </div>
  </div>
</nav>

<div class="container">
    <div class="card card-form p-4">
        <h1 class="mb-4 text-center">Créer un compte</h1>
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label>Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Adresse e-mail</label>
                <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Mot de passe</label>
                <input type="password" name="password1" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Confirmer le mot de passe</label>
                <input type="password" name="password2" class="form-control" required>
            </div>

            {% if form.errors %}
            <div class="error-text mb-3">
                {% for field in form %}
                    {% for error in field.errors %}
                        <p class="mb-1">{{ error }}</p>
                    {% endfor %}
                {% endfor %}
            </div>
            {% endif %}

            <button type="submit" class="btn btn-primary w-100 text-white mt-2">S'inscrire</button>
        </form>
        <p class="text-center mt-3">Déjà inscrit ? <a href="/comptes/connexion/">Se connecter</a></p>
    </div>
</div>

</body>
</html>
