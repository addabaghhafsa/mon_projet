{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — ImmoResa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f6f2; font-family: Georgia, serif; }
        .navbar { background-color: #2c2c2c !important; }
        .btn-primary { background-color: #c9a876; border: none; }
        .btn-primary:hover { background-color: #b8925f; }
        .card-form { max-width: 450px; margin: 60px auto; box-shadow: 0 2px 15px rgba(0,0,0,0.08); border: none; }
        h1 { font-weight: 300; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark">
  <div class="container">
    <a class="navbar-brand" href="/">IMMORESA</a>
    <div>
      <a href="/reservations/" class="btn btn-outline-light btn-sm me-2">Créneaux</a>
      <a href="/reservations/mes-reservations/" class="btn btn-outline-light btn-sm me-2">Mes réservations</a>
      <a href="/comptes/inscription/" class="btn btn-primary btn-sm">S'inscrire</a>
    </div>
  </div>
</nav>

<div class="container">
    <div class="card card-form p-4">
        <h1 class="mb-4 text-center">Connexion</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Se connecter</button>
        </form>
        <p class="text-center mt-3">Pas encore de compte ? <a href="/comptes/inscription/">S'inscrire</a></p>
    </div>
</div>

</body>
</html>
